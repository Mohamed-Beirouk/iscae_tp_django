<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISCAE Donation Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🩸 ISCAE Donation Platform</h1>
            <div class="auth-buttons">
                <button id="showLoginBtn" class="btn btn-primary">Login</button>
                <button id="showRegisterBtn" class="btn btn-secondary">Register</button>
                <button id="logoutBtn" class="btn btn-danger" style="display: none;">Logout</button>
            </div>
        </header>

        <!-- Login Modal -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div id="loginError" class="error-message"></div>
            </div>
        </div>

        <!-- Register Modal -->
        <div id="registerModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name:</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name:</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="tel">Phone Number:</label>
                        <input type="tel" id="tel" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group">
                        <label for="groupeSanguin">Blood Group:</label>
                        <select id="groupeSanguin">
                            <option value="">Select...</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dateNaissance">Date of Birth:</label>
                        <input type="date" id="dateNaissance">
                    </div>
                    <div class="form-group">
                        <label for="location">Location:</label>
                        <input type="text" id="location">
                    </div>
                    <div class="form-group">
                        <label for="nni">NNI:</label>
                        <input type="text" id="nni" maxlength="10">
                    </div>
                    <div class="form-group">
                        <label for="maladie">Diseases:</label>
                        <textarea id="maladie" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="antecedents">Medical History:</label>
                        <textarea id="antecedents" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="bio">Bio:</label>
                        <textarea id="bio" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="pretPourDon">
                            Ready to donate
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <div id="registerError" class="error-message"></div>
            </div>
        </div>

        <!-- Main Content -->
        <main>
            <!-- User Profile Section -->
            <section id="userProfile" class="card" style="display: none;">
                <h2>My Profile</h2>
                <div id="profileContent"></div>
            </section>

            <!-- Donation History Section -->
            <section id="donationHistory" class="card" style="display: none;">
                <h2>My Donation History</h2>
                <button id="showDonationFormBtn" class="btn btn-primary">Add New Donation</button>
                <div id="donationList"></div>
            </section>

            <!-- Add Donation Modal -->
            <div id="donationModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Add Donation</h2>
                    <form id="donationForm">
                        <div class="form-group">
                            <label for="dateDon">Donation Date:</label>
                            <input type="date" id="dateDon" required>
                        </div>
                        <div class="form-group">
                            <label for="lieuDon">Donation Location:</label>
                            <input type="text" id="lieuDon" required>
                        </div>
                        <div class="form-group">
                            <label for="quantiteDonnee">Quantity (ml):</label>
                            <input type="number" id="quantiteDonnee" step="0.1" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Donation</button>
                    </form>
                    <div id="donationError" class="error-message"></div>
                </div>
            </div>

            <!-- Leaderboard Section -->
            <section id="leaderboard" class="card">
                <h2>Monthly Leaderboard</h2>
                <div id="leaderboardContent"></div>
            </section>

            <!-- Donation Centers Section -->
            <section id="donationCenters" class="card">
                <h2>Donation Centers</h2>
                <div id="centersContent"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
